name: NEXUS Android Debug Build

on:
  push:
    branches: ["main", "nexus-branding-cleanup", "nexus-premium-amoled-efficiency"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Universal FOSS Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Prepare Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;28.2.13676358"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleUniversalFossDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Universal-FOSS-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Run Android lint
        timeout-minutes: 15
        run: |
          ./gradlew --no-daemon --stacktrace :app:lintUniversalFossDebug

      - name: Run unit tests
        timeout-minutes: 15
        run: |
          ./gradlew --no-daemon --stacktrace test
